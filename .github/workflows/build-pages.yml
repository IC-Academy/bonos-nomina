name: Build GitHub Pages assets
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'pages.html'
      - 'vite.pages.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Publish built files to main root
        run: |
          rm -rf assets
          cp -R pages-dist/assets ./assets
          cp pages-dist/pages.html ./index.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "No build changes"
          else
            git commit -m "build: refresh GitHub Pages bundle"
            git push
          fi
